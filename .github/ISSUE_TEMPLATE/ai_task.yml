name: "🤖 AI 에이전트 작업 요청 (AI Task)"
description: "AI 에이전트에게 할당할 기능 개발, 리팩터링, 버그 수정 태스크를 정의합니다."
title: "[Task]: "
labels: ["ai-task", "status:ready"]
body:
  - type: markdown
    attributes:
      value: |
        ### AI 에이전트 작업 지시서
        이슈가 생성되면 AI 에이전트가 이 내용을 바탕으로 브랜치를 생성하고 작업을 수행합니다.
  - type: input
    id: goal
    attributes:
      label: "작업 목표 (Goal)"
      description: "달성해야 하는 명확한 목표를 한두 문장으로 기술하세요."
      placeholder: "예: 모바일 뷰포트에서 히어로 섹션 이미지 깨짐 현상 수정"
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: "상세 요구사항 및 범위 (Scope)"
      description: "구체적으로 변경해야 할 사항, 디자인 요구조건, 제약 사항을 작성하세요."
      placeholder: "- 대상 파일: css/styles.css, index.html\n- 반응형 미디어 쿼리(768px 이하) 보완"
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: "완료 기준 (Acceptance Criteria)"
      description: "작업이 성공적으로 완료되었음을 검증할 수 있는 구체적 조건(체크리스트)을 작성하세요."
      value: |
        - [ ] 정적 유효성 검사(HTML/CSS/JS)를 통과할 것
        - [ ] 기존 스타일 및 레이아웃이 깨지지 않을 것
    validations:
      required: true
